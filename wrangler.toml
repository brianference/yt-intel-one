name = "yt-intel-one"
compatibility_date = "2026-07-01"
pages_build_output_dir = "dist"

# Cloudflare D1 (edge SQLite), SHARED with agent-tower and the other fleet app.
# The free tier caps D1 at 10 databases per account, so these three share one.
# Tenancy is enforced by users.app with a unique index on (app, email), and by
# APP.scope in functions/_lib/appconfig.ts. Dropping that scope would merge the
# user bases -- proven by auth-kit/test/tenancy.mjs, which goes red without it.
[[d1_databases]]
binding = "DB"
database_name = "yt-intel-one-db"
database_id = "4e60e744-2ba2-48e0-a8f8-0dad1220aae7"
migrations_dir = "migrations"

# Plain-text configuration. NOTE: [vars] is replace-not-merge: any var missing
# from this block is dropped from the deployment. Secrets (BREVO_API_KEY,
# RATE_LIMIT_SALT) are set with `wrangler pages secret put` and never appear here.
[vars]
SITE_URL   = "https://yt-intel-one.pages.dev"
MAIL_FROM  = "no-reply@txeas.com"
CONTACT_TO = "brianference@protonmail.com"
